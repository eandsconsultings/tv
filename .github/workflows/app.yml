name: Build app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-app
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: actions/cache@v4
        id: signing
        with:
          path: signing/onyx.keystore
          key: onyx-signing-key-1
      - name: Create the signing key (first build only)
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          mkdir -p signing
          keytool -genkeypair -keystore signing/onyx.keystore -storetype PKCS12 -storepass onyxtv -keypass onyxtv -alias onyx -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 12000 -dname "CN=Onyx TV"
      - run: gradle --no-daemon assembleDebug
      - name: Publish
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/tv.apk
          cd out
          git init -q -b apk
          git config user.name "app-bot"
          git config user.email "app-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
