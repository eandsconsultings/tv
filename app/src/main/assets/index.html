<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide TV preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05080c;color:#fff;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
#note{position:fixed;left:0;right:0;top:0;height:34px;display:flex;align-items:center;gap:18px;padding:0 14px;
  font-size:13px;color:#c9d3df;background:#101822;border-bottom:1px solid #223;white-space:nowrap;overflow:hidden}
#note b{color:#ffd27a}
#wrap{position:fixed;left:0;right:0;top:34px;bottom:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:960px;height:540px;background:#000;overflow:hidden;transform-origin:center center;flex:none;--fs:1;--rh:46px;--g1:#27364a;--g2:#1b2838;--g3:#141d2a}
#guide{position:absolute;inset:0;background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%)}
video{position:absolute;left:0;top:0;width:960px;height:540px;background:#000}
video.mini{left:16px;top:12px;width:320px;height:180px;border-radius:8px}
#pip{position:absolute;display:none;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.6);outline:2px solid var(--acc)}
#pip video{position:static;width:100%;height:100%;display:block}
#pip span{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:12px;background:rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info{position:absolute;left:356px;top:14px;right:20px;height:180px;overflow:hidden}
#info h1{font-size:calc(22px*var(--fs));font-weight:700;line-height:1.2;max-height:54px;overflow:hidden}
#meta{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:calc(14px*var(--fs));color:#dbe4ee}
#meta .pb{width:60px;height:3px;background:rgba(255,255,255,.25);border-radius:2px}
#meta .pb i{display:block;height:100%;background:#fff;border-radius:2px}
#favhint{position:absolute;left:0;bottom:0;font-size:13px;color:var(--acc);font-weight:500}
#info p{font-size:calc(14px*var(--fs));color:var(--txt2);margin-top:6px;line-height:1.35;max-height:96px;overflow:hidden}
#head{position:absolute;left:0;right:0;top:204px;height:26px;font-size:14px}
#head .now{position:absolute;left:16px;top:3px;color:var(--acc);font-weight:700;white-space:nowrap}
#head .tick{position:absolute;top:3px;color:#e6edf5;font-weight:700;white-space:nowrap}
#head .line{position:absolute;left:16px;right:0;bottom:0;height:1px;background:rgba(255,255,255,.35)}
#rows{position:absolute;left:0;right:0;top:234px;bottom:0;overflow:hidden}
.r{position:absolute;left:0;right:0;height:var(--rh)}
.cn{position:absolute;left:16px;top:0;width:240px;height:var(--rh);display:flex;align-items:center;gap:8px}
.cn .no{width:34px;text-align:right;font-size:14px;color:var(--txt2);flex:none}
.cn .lg{width:46px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}
.cn img{max-width:46px;max-height:34px}
.cn .nm{font-size:calc(15px*var(--fs));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.cur .nm{color:var(--acc)}
.cell{position:absolute;top:0;height:var(--rh);background:var(--cell);border-radius:4px;padding:0 12px;line-height:var(--rh);
  font-size:calc(15px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e9eef4}
.cell.f{background:var(--foc);color:var(--focfg);font-weight:500}
.cell.past{color:#aab6c3}
#nowline{position:absolute;top:226px;bottom:0;width:2px;background:var(--acc);opacity:.9}
#nowline:before{content:"";position:absolute;left:-3px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none}
#m1{position:absolute;left:0;top:0;bottom:0;width:176px;background:var(--m1);color:var(--m1fg);padding-top:118px;display:none}
#m1.thin{width:54px}
.mi{display:flex;align-items:center;gap:12px;margin:4px 10px;padding:9px 12px;border-radius:6px;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden}
.mi svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mi.f{background:var(--m1f);color:var(--m1ffg,inherit)}
.mi.on{background:rgba(255,255,255,.55)}
#m1.thin .mi span{display:none}
#m1.thin .mi{margin:4px 6px;padding:9px 11px}
#m2{position:absolute;left:176px;top:0;bottom:0;width:270px;background:linear-gradient(160deg,var(--m2a),var(--m2b));padding:18px 10px;display:none;overflow:hidden}
#m2 h2{font-size:13px;font-weight:700;color:var(--acc);padding:0 12px 8px;letter-spacing:.06em;text-transform:uppercase}
.si{padding:8px 12px;border-radius:6px;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si small{display:block;font-size:12px;font-weight:400;color:var(--txt2);overflow:hidden;text-overflow:ellipsis}
.si.f{background:var(--foc);color:var(--focfg)}
.si.f small{color:var(--focsub)}
.si.sel{color:var(--acc)}
.si.f.sel{color:var(--focfg)}
#q{margin:0 12px 10px;padding:8px 10px;border-radius:6px;background:var(--cell);font-size:16px;min-height:36px}
#q.f{outline:2px solid var(--foc)}
#m2 .empty{padding:8px 12px;font-size:14px;color:var(--txt2);line-height:1.4;white-space:pre-line}
#m3{position:absolute;left:446px;top:0;bottom:0;width:400px;background:var(--m3);padding:0 0 10px;display:none;overflow:hidden}
#m3 h2{font-size:24px;font-weight:700;padding:22px 26px 16px;background:var(--m3h)}
.oi{display:flex;align-items:center;gap:12px;margin:3px 10px;padding:9px 16px;border-radius:6px;font-size:16px;font-weight:500}
.oi .tx{flex:1;min-width:0}
.oi small{display:block;font-size:13px;font-weight:400;color:var(--txt2);margin-top:2px}
.oi.f{background:var(--foc);color:var(--focfg)}
.oi.f small{color:var(--focsub)}
.oi.dim{color:#9aa8b8}
.sw{width:34px;height:18px;border-radius:9px;background:rgba(255,255,255,.3);position:relative;flex:none}
.sw:after{content:"";position:absolute;left:1px;top:1px;width:16px;height:16px;border-radius:50%;background:#dfe6ee}
.sw.on{background:var(--acc)}.sw.on:after{left:17px;background:#fff}
.oi.f .sw{background:rgba(27,40,56,.3)}.oi.f .sw.on{background:var(--focfg)}
#guide{z-index:1}video{z-index:0}video.mini{z-index:2}#pip,#shade,#m1,#m2,#m3,#ov,#ovtop,#banner,#status,#toast{z-index:3}
#guide.glass{background:rgba(18,26,38,.72)}
#guide.glass{background:linear-gradient(160deg,color-mix(in srgb,var(--g1) 62%,transparent),color-mix(in srgb,var(--g3) 78%,transparent))}
#biglogo{position:absolute;left:16px;top:12px;width:320px;height:180px;display:none;align-items:center;justify-content:center}
#biglogo img{max-width:220px;max-height:130px}
#ov{position:absolute;left:0;right:0;bottom:0;padding:70px 24px 14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.82) 42%);display:none}
#ovtop{position:absolute;left:24px;top:14px;right:24px;display:none;justify-content:space-between;font-size:14px;font-weight:700;text-shadow:0 1px 3px #000}
#ovinfo{display:flex;gap:16px;align-items:flex-end}
#ovinfo .lg{width:110px;height:70px;display:flex;align-items:center;justify-content:center;flex:none}
#ovinfo .lg img{max-width:110px;max-height:70px}
#ovinfo h1{font-size:22px;font-weight:700}
#ovinfo .l{display:flex;align-items:center;gap:12px;font-size:14px;margin-top:3px;color:#e6edf5;white-space:nowrap}
#ovinfo .pb{width:60px;height:3px;background:rgba(255,255,255,.3);border-radius:2px}#ovinfo .pb i{display:block;height:100%;background:#fff;border-radius:2px}
#ovbar{height:3px;background:rgba(255,255,255,.3);margin:10px 0 10px;border-radius:2px}#ovbar i{display:block;height:100%;background:var(--acc);border-radius:2px}
#tiles{display:flex;gap:8px;overflow:hidden}
.tile{width:118px;height:78px;flex:none;border-radius:6px;background:rgba(40,48,58,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:500;padding:6px;text-align:center}
.tile svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile img{max-width:90px;max-height:34px}
.tile span{max-width:106px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.f{background:var(--foc);color:var(--focfg)}
#tiles.tools{gap:2px;padding-top:6px}
.tool{width:101px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;text-align:center;height:84px}
.tool i{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool span{max-width:98px;line-height:1.2;max-height:30px;overflow:hidden;text-shadow:0 1px 3px #000}
.tool.f i{background:var(--foc);color:var(--focfg)}
#ovmore{text-align:center;height:12px;font-size:11px;opacity:.7;margin-top:2px}
#clist{position:absolute;left:0;top:0;bottom:0;width:330px;display:none;z-index:4;background:linear-gradient(90deg,rgba(8,12,18,.96),rgba(8,12,18,.86));padding:16px 0}
#clist h2{font-size:20px;font-weight:500;padding:0 20px 10px}
#clist .ci{padding:7px 20px;height:46px;overflow:hidden}
#clist .ci b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clist .ci small{display:block;font-size:12px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clist .ci.f{background:var(--foc);color:var(--focfg)}#clist .ci.f small{color:inherit;opacity:.75}
#srch{position:absolute;inset:0;display:none;z-index:6;background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%);padding:26px 40px 0}
#srch .bar{display:flex;align-items:center;gap:18px;margin-bottom:14px}
#srch .bar svg{width:38px;height:38px;fill:none;stroke:var(--acc);stroke-width:2;flex:none}
#sq{flex:1;height:44px;border-radius:6px;background:rgba(255,255,255,.14);padding:0 16px;font-size:20px;line-height:44px;white-space:nowrap;overflow:hidden}
#sq i{display:inline-block;width:2px;height:22px;background:var(--acc);vertical-align:-4px;margin-left:1px}
#sq em{font-style:normal;color:var(--txt2)}
#srch h4{font-size:15px;font-weight:500;color:var(--txt2);margin:10px 0 8px}
#srch .strip{display:flex;gap:10px;overflow:hidden;height:118px}
#srch .card{flex:none;width:168px;height:112px;border-radius:8px;background:rgba(0,0,0,.32);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid transparent;overflow:hidden}
#srch .card.f{background:var(--foc,#eef3f8);color:#10202f;border-color:var(--acc)}
#srch .card b{font-size:15px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#srch .card small{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#srch .card .when{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--acc)}
#srch .card.f .when{color:#10202f}
#srch .card img{max-width:120px;max-height:44px;object-fit:contain;align-self:flex-start}
#srch .none{font-size:15px;color:var(--txt2);padding:18px 0;line-height:1.5;white-space:pre-line}
#kb{position:absolute;right:28px;bottom:18px;width:470px;background:rgba(10,14,20,.94);border-radius:12px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#kb .sug{display:flex;gap:8px;height:34px;margin-bottom:8px;overflow:hidden}
#kb .sug span{flex:none;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.1);font-size:14px;line-height:34px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#kb .kr{display:flex;gap:5px;margin-bottom:5px}
#kb .k{flex:1;height:40px;border-radius:5px;background:rgba(255,255,255,.1);font-size:19px;display:flex;align-items:center;justify-content:center}
#kb .k.w{flex:3.2}
#kb .k.s{background:rgba(255,255,255,.2);font-size:14px}
#kb .f{background:#fff!important;color:#10202f}
html.native,html.native body,html.native #stage{background:transparent}
html.native #note{display:none}html.native #wrap{top:0}
html.native video{visibility:hidden}html.native #pip{background:transparent}
#ask{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5}
#ask .box{width:640px;background:var(--m3);border-radius:8px;padding:22px 24px}
#ask h3{font-size:20px;margin-bottom:6px}
#ask p{font-size:13px;color:var(--txt2);margin-bottom:12px;line-height:1.4}
#ask input{width:100%;font:16px/1.3 inherit;padding:10px 12px;border-radius:6px;border:2px solid var(--acc);background:rgba(0,0,0,.35);color:#fff;outline:none}
#ask small{display:block;margin-top:10px;font-size:12px;color:var(--txt2)}
#banner{position:absolute;left:28px;bottom:28px;background:rgba(20,29,42,.92);padding:12px 18px;font-size:16px;white-space:pre-line;display:none;max-width:70%;border-radius:6px}
#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;text-align:center;white-space:pre-line;pointer-events:none}
#toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:#323232;border-radius:20px;padding:8px 18px;font-size:14px;display:none;white-space:nowrap}
</style>

<body>
<div id="note"><b>Browser preview of Guide TV</b><span>Arrows = remote pad</span><span>Enter = OK (hold for favorite)</span><span>M = Menu</span><span>Esc = Back</span><span>Enter while watching = pop-up menu</span><span>Left in the guide = side menu</span><span>P = send channel to small window</span><span>S = swap</span><span>X = close it</span></div>
<div id="wrap"><div id="stage">
  <div id="guide">
    <div id="biglogo"></div>
    <div id="info"><h1 id="it"></h1><div id="meta"></div><p id="id"></p><div id="favhint"></div></div>
    <div id="head"></div>
    <div id="rows"></div>
    <div id="nowline"></div>
  </div>
  <video id="v" class="mini" playsinline></video>
  <div id="pip"><video id="v2" muted playsinline></video><span id="pipname"></span></div>
  <div id="shade"></div>
  <div id="m1"></div>
  <div id="m2"></div>
  <div id="m3"></div>
  <div id="ovtop"><span id="ovcat"></span><span id="ovclock"></span></div>
  <div id="ov"><div id="ovinfo"></div><div id="ovbar"><i></i></div><div id="tiles"></div><div id="ovmore"></div></div>
  <div id="clist"></div>
  <div id="srch"><div class="bar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><div id="sq"></div></div><div id="sres"></div><div id="kb"></div></div>
  <div id="ask"><div class="box"><h3 id="askt"></h3><p id="askp"></p><input id="aski" spellcheck="false" autocomplete="off"><small>Enter saves. Esc cancels.</small></div></div>
  <div id="banner"></div>
  <div id="status">Loading channels and guide...</div>
  <div id="toast"></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
"use strict";
// Mirrors the Fire TV app's logic so layout and remote behavior can be tried in a browser.
const PLAYLIST = "https://raw.githubusercontent.com/eandsconsultings/epg/dist/full.m3u";
const GUIDE = "https://raw.githubusercontent.com/eandsconsultings/epg/dist/guide.xml.gz";
const ALL = "All channels", FAVS = "Favorites";
const HALF = 1800000, X0 = 262;
let SPAN = 4 * HALF, PPM = (960 - X0) / 120, ROW = 49, VISIBLE = 6;
const $ = id => document.getElementById(id);
// Inside the TV app the picture is drawn by the device's own player, underneath this page.
const NATIVE = !!window.Native; let nPaused = false;
if (NATIVE) document.documentElement.classList.add("native");
window.tvKey = (type, key, repeat) => dispatchEvent(new KeyboardEvent(type, { key, repeat: !!repeat, cancelable: true }));
window.nativeError = i => { if (i === 0) { if (current) recover(); } else if (pip) { toast(pip.name + " isn't playing in the second window"); startPip(null); render(); } };
function nInfo() { try { return JSON.parse(Native.info()); } catch (e) { return {}; } }
function syncNative() {
  if (!NATIVE) return; const d = window.devicePixelRatio || 1;
  const send = (i, el, show) => { const r = el.getBoundingClientRect(); Native.layout(i, Math.round(r.left * d), Math.round(r.top * d), Math.round(r.width * d), Math.round(r.height * d), show); };
  send(0, v, true); const pe = $("pip"); send(1, pe, pe.style.display !== "none");
}
const v = $("v");

const store = {
  get(k, d) { try { const x = localStorage.getItem("gtv." + k); return x === null ? d : JSON.parse(x); } catch (e) { return d; } },
  set(k, x) { try { localStorage.setItem("gtv." + k, JSON.stringify(x)); } catch (e) {} }
};

let channels = [], progs = {}, groups = [], shown = [], cat = ALL, current = null;
let favs = new Set(store.get("favs", []));
// ---------- themes ----------
// bg: three-stop background, acc: accent, foc/focfg: highlighted item and its text, cell: program blocks,
// m1/m1fg/m1f: main menu, m2: second panel, m3/m3h: settings panel and its header, txt2: secondary text
const THEMES = {
  "Midnight":    { bg: ["#27364a", "#1b2838", "#141d2a"], acc: "#8fc0ff", foc: "#eef3f8", focfg: "#1b2838", focsub: "#42556b", cell: "rgba(10,16,24,.55)", m1: "#c9d3de", m1fg: "#1b2838", m1f: "#ffffff", m2: ["#30425a", "#1e2c3f"], m3: "#3a4656", m3h: "#56637a", txt2: "#c4cfdb" },
  "Onyx Gold":   { bg: ["#1c1a17", "#0f0e0c", "#050505"], acc: "#d4af37", foc: "#d4af37", focfg: "#14110a", focsub: "#4a3c12", cell: "rgba(255,255,255,.06)", m1: "#14120f", m1fg: "#e9dcb5", m1f: "#d4af37", m1ffg: "#14110a", m2: ["#24201a", "#141210"], m3: "#1d1a16", m3h: "#2b261e", txt2: "#b9ae94" },
  "Champagne":   { bg: ["#3a3129", "#241e19", "#15110e"], acc: "#f0dcb0", foc: "#f3e7cc", focfg: "#2a2118", focsub: "#6b5a44", cell: "rgba(20,14,9,.5)", m1: "#efe4cf", m1fg: "#2a2118", m1f: "#ffffff", m2: ["#463a30", "#2a221c"], m3: "#3b3129", m3h: "#56483b", txt2: "#d6c8b0" },
  "Emerald":     { bg: ["#0f3b33", "#0a2823", "#051613"], acc: "#e2c275", foc: "#e2c275", focfg: "#08221d", focsub: "#3d4a2a", cell: "rgba(0,0,0,.32)", m1: "#082620", m1fg: "#eadfba", m1f: "#e2c275", m1ffg: "#08221d", m2: ["#12463c", "#0a2a24"], m3: "#0e342d", m3h: "#16493f", txt2: "#b5cfc6" },
  "Burgundy":    { bg: ["#4a1626", "#2e0d18", "#17060c"], acc: "#e8b4a0", foc: "#f2d6ca", focfg: "#2e0d18", focsub: "#7a4350", cell: "rgba(0,0,0,.32)", m1: "#f0dcd3", m1fg: "#2e0d18", m1f: "#ffffff", m2: ["#551a2c", "#30101a"], m3: "#3e1421", m3h: "#5c2233", txt2: "#dcbfc2" },
  "Sapphire":    { bg: ["#16255c", "#0d163a", "#060a1e"], acc: "#cfd8ea", foc: "#e6ebf5", focfg: "#0d163a", focsub: "#44507a", cell: "rgba(0,0,0,.34)", m1: "#0a1130", m1fg: "#d9e0f0", m1f: "#3d55b8", m1ffg: "#ffffff", m2: ["#1c2e6e", "#0f1a44"], m3: "#15225a", m3h: "#22347d", txt2: "#b8c3de" },
  "Graphite":    { bg: ["#3b444f", "#2a3038", "#1c2026"], acc: "#9fd0c8", foc: "#e8ecef", focfg: "#22272e", focsub: "#4d5661", cell: "rgba(0,0,0,.3)", m1: "#cfd4d9", m1fg: "#22272e", m1f: "#ffffff", m2: ["#444d58", "#2c323a"], m3: "#3a424c", m3h: "#525c68", txt2: "#c3cad1" }
};
// ---------- settings ----------
const SECTIONS = [
  { label: "General", items: [
    { k: "lastOnStart", label: "Turn on last channel on app start", type: "toggle", def: true },
    { k: "confirmExit", label: "Confirm exit by second press Back", type: "toggle", def: true },
    { k: "bootStart", label: "Auto start app on boot", sub: "May not work on all devices", type: "toggle", def: false },

function searchKey(e) {

function subItems() {

function drawMenu() {

function pickOption() {

addEventListener("keydown", e => {
